# Fly.io configuration
app = "tysiac-game"
primary_region = "waw" # Warsaw - closest to Poland

[build]
  builder = "heroku"

[env]
  NODE_ENV = "production"
  PORT = "3001"

[[services]]
  protocol = "tcp"
  internal_port = 3001
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[statics]]
  guest_path = "/app/frontend/build"
  url_prefix = "/static"
